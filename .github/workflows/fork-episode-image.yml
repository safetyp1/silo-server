name: Fork Episode Order Image

on:
  push:
    branches: [test/episode-date-order]
    paths-ignore: [.github/workflows/fork-pr-validation.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-episode-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'safetyp1/silo-server'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: silo_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d silo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-name: fork-episode-tests
      - name: Check Go formatting
        run: test -z "$(gofmt -l internal/catalog)"
      - name: Catalog and section unit tests
        run: go test ./internal/catalog/... ./internal/sections/...
      - name: Migrate disposable database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/silo_test?sslmode=disable
        run: SECRET_KEY="$(openssl rand -base64 48)" go run ./cmd/silo/ --migrate-only
      - name: Episode cursor regression tests
        env:
          SILO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/silo_test?sslmode=disable
        run: go test -race -count=1 -v ./internal/catalog -run '^TestQueryCursorPostgresEpisodeParity$'

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build identity
        run: echo "BUILD_DATE=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/safetyp1/silo-server-episode-order,push-by-digest=true,name-canonical=true,push=true
          labels: org.opencontainers.image.source=https://github.com/safetyp1/silo-server
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=gha,scope=episode-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=episode-${{ matrix.arch }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish test tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          images=()
          for digest in *; do
            images+=("ghcr.io/safetyp1/silo-server-episode-order@sha256:$digest")
          done
          docker buildx imagetools create \
            -t ghcr.io/safetyp1/silo-server-episode-order:episode-date-order \
            -t "ghcr.io/safetyp1/silo-server-episode-order:episode-date-order-$GITHUB_SHA" \
            "${images[@]}"
          docker buildx imagetools inspect "ghcr.io/safetyp1/silo-server-episode-order:episode-date-order-$GITHUB_SHA"